[build-system]
# Pinned below 1.32 because hatchling 1.32.0 raised the emitted core metadata to
# Metadata-Version 2.5, which the current twine cannot parse: "twine check" fails
# with "2.5 is not a valid metadata version", and that check gates the publish
# workflow. Raise the ceiling once twine accepts 2.5.
requires = ["hatchling<1.32"]
build-backend = "hatchling.build"

[project]
name = "theoryforge"
version = "0.6.0"
description = "Systematic theory development."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pablo Bernabeu", email = "pcbernabeu@gmail.com" }]
keywords = ["theory", "metascience", "falsifiability", "psychology", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff", "mypy"]
# Native diagram rendering (render_diagram); writing image files additionally
# needs the Graphviz system binaries.
render = ["graphviz>=0.20"]
# The documentation site; markdown-exec runs the example blocks at build time.
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "markdown-exec>=1.8"]

[project.urls]
Homepage = "https://github.com/pablobernabeu/theoryforge"
Repository = "https://github.com/pablobernabeu/theoryforge"
Documentation = "https://pablobernabeu.github.io/theoryforge/python/"
"R twin" = "https://pablobernabeu.github.io/theoryforge/r/"
Issues = "https://github.com/pablobernabeu/theoryforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/theoryforge"]
# Non-Python files inside the package dir (schema/*.json, *.yaml, py.typed) are
# included automatically by hatchling.

# src/theoryforge/fixtures/ holds the example theories, so the wheel can offer
# them through example_path() as the R twin does through system.file(). They
# cannot be pulled in from ../fixtures at build time, because `python -m build`
# builds the wheel from the sdist and the sdist cannot reach outside its own
# root; they are committed copies instead, written by scripts/gen_golden.py and
# gated in CI so they cannot drift from the originals.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
files = ["src/theoryforge"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
