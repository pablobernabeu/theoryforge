site_name: theoryforge (Python)
site_description: Systematic theory development. A reproducible workflow for building, developing and testing scientific theories.
site_author: Pablo Bernabeu
site_url: https://pablobernabeu.github.io/theoryforge/python/
repo_url: https://github.com/pablobernabeu/theoryforge
# The licence link is absolute: the copyright line renders on every page, and a
# relative link would resolve against nested pages and break.
copyright: >-
  <span class="mrd-footer-badges">
  <a href="https://github.com/pablobernabeu/theoryforge/actions/workflows/ci.yml"><img src="https://github.com/pablobernabeu/theoryforge/actions/workflows/ci.yml/badge.svg" alt="CI"></a>
  <a href="https://lifecycle.r-lib.org/articles/stages.html#experimental"><img src="https://img.shields.io/badge/lifecycle-experimental-orange.svg" alt="Lifecycle: experimental"></a>
  <a href="https://opensource.org/license/MIT"><img src="https://img.shields.io/badge/license-MIT-blue.svg" alt="License: MIT"></a>
  </span>
  Developed by <a href="https://pablobernabeu.github.io">Pablo Bernabeu</a>.
  Open, reproducible research software in R and Python. Released under the
  <a href="https://pablobernabeu.github.io/theoryforge/python/licence/">MIT licence</a>.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  # The header and footer are held at the deep-navy brand ink in both schemes
  # (primary: black is the closest preset, retuned to the exact navy in
  # stylesheets/brand.css); accent carries the warm amber.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/brand.css

# The app is reached through the header App pill (overrides/partials/header.html),
# matching the family convention, so it does not repeat in the nav.
nav:
  - Home: index.md
  - Get started: getting-started.md
  - API reference: api.md
  - Guides:
      - Workflow modes: workflow-modes.md
      - Literature layer: literature.md
      - Methodological foundations: methodology.md
  - Changelog: changelog.md
  - About: about.md

plugins:
  - search
  # Runs the example blocks at build time and embeds their real output, so the
  # guides show results like a knitted R vignette and cannot drift from the code.
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            docstring_style: google
            # api.md groups its objects under h2 section headings, mirroring the
            # R package's reference index. At mkdocstrings' default level the object
            # headings would also be h2, flattening the table of contents into one
            # list in which no object shows which group it belongs to.
            heading_level: 3

markdown_extensions:
  - admonition
  # Renders the clickable anchor beside every heading, so any section can be
  # linked to directly. The rest of the family's sites carry these.
  - toc:
      permalink: true
  - pymdownx.highlight:
      # Tag each block with its language, so brand.css can tell output pasted
      # into a `text` fence from a source block and style it as output.
      pygments_lang_class: true
  - pymdownx.superfences
  # Snippets embeds the repository's LICENSE and CHANGELOG.md into the licence and
  # changelog pages, so neither page can drift from the file it reports.
  # pymdown-extensions ships with mkdocs-material. base_path is listed explicitly
  # because the two files sit at different levels: LICENSE beside this config, the
  # changelog at the root of the monorepo, which the default base_path never reaches.
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - .
        - ..

# Build with:  pip install -e .[docs] && mkdocs build
# (the docs extra carries mkdocs-material, mkdocstrings[python] and
# markdown-exec, and the editable install lets markdown-exec's example blocks
# import theoryforge itself)

# The released version shown beside the title in the header (updated on release).
extra:
  version: "0.6.0"
