    action: "hand_encoding"
    detail: "Encoded by encoder 3 from source-bilingual-rhm.md, which follows Kroll et al. (2010), doi:10.1017/S136672891000009X, and Kroll and Stewart (1994), doi:10.1006/jmla.1994.1008."
