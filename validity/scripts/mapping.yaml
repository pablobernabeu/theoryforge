# Judgements that build_register.py reads. Each was made by reading the lens's
# finding or verdict and the second reader's text side by side.
#
# checks: the second reader's checks, numbered in the order the reader gave
#   them. Each names the lens finding and/or verdict it examines (numbered in
#   the lens's order), or none. verdict_verified and recommendation_verified
#   record a verdict or recommendation the reader changed.
# evidence: evidence_path for a lens finding where the first file its evidence
#   names is not the right one, or where the reader's correction rests the
#   finding on the reader's own case. Paths are relative to the audit
#   directory, several separated by '; '. An empty string leaves it blank.
# missed: the items the reader said the lens missed. defect: true adds the item
#   to the register as a finding raised by the second reader; extends names
#   the lens finding it adds to; severity is filled only where the reader's
#   text states one. defect: false items comment on the lens's own analysis,
#   report a positive result or concern future work, and are left out.

