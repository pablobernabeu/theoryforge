# Version 1 of a network theory of panic disorder. Its causal graph, a loop
# between arousal and perceived threat that feeds avoidance, implies that
# arousal and avoidance are independent given perceived threat, and pred_indep
# states that independence. A test refuted it, and the amended version
# (panic-network-2026-v2.theory.yaml) answers with a direct path from arousal to
# avoidance.
schema_version: "1.1"
id: "panic-network-2026"
title: "Network theory of panic disorder"
maturity: "developing"
theory_form: "network"
version:
  id: "v1"
  parent_id: null
  content_hash: null

constructs:
  - id: c_arousal
    label: "Physiological arousal"
    definition: "Bodily activation indexed by heart rate, respiration and electrodermal response."
    measurement: ["heart-rate variability", "self-reported arousal"]
    boundary_conditions: ["adults", "non-clinical baseline", "no beta-blocker medication"]
  - id: c_perceived_threat
    label: "Perceived threat"
    definition: "The appraised dangerousness of internal sensations and external context."
    measurement: ["threat appraisal questionnaire"]
    boundary_conditions: ["adults", "non-clinical baseline", "waking hours"]
  - id: c_avoidance
    label: "Avoidance behaviour"
    definition: "Acts that reduce exposure to feared situations or sensations."
    measurement: ["behavioural avoidance task", "diary counts"]
    boundary_conditions: ["adults", "waking hours", "community sample"]

propositions:
  - id: p1
    from: c_arousal
    to: c_perceived_threat
    relation: "increases"
    mechanism: "Interoceptive feedback: rising arousal is detected and appraised as danger."
    functional_form: "monotonic"
  - id: p2
    from: c_perceived_threat
    to: c_avoidance
    relation: "increases"
    mechanism: "Threat appraisal motivates protective withdrawal."
  - id: p3
    from: c_perceived_threat
    to: c_arousal
    relation: "causes"
    mechanism: "Catastrophic appraisal triggers sympathetic activation, closing a positive loop."

boundary_conditions: ["adults", "non-clinical baseline", "no beta-blocker medication", "waking hours", "community sample"]

predictions:
  - id: pred1
    derives_from: [p1, p3]
    statement: "An interoceptive challenge raises heart rate 20 beats per minute above baseline, within a measurement tolerance of 5, within 90 seconds."
    type: "point"
    bounds: {lower: 15, upper: 25}
    risk_score: 0.8
    severity: 0.7
    diagnostic_vs: [alt_cognitive]
  - id: pred2
    derives_from: [p2]
    statement: "Avoidance frequency falls within a 20-35% band after exposure therapy."
    type: "interval"
    bounds: {lower: 20, upper: 35}
    risk_score: 0.6
    severity: 0.6
    diagnostic_vs: []
  - id: pred3
    derives_from: [p2]
    statement: "Higher perceived threat is associated with more avoidance."
    type: "directional"
    risk_score: 0.3
    severity: 0.4
    diagnostic_vs: []
  - id: pred_indep
    derives_from: [p1, p2, p3]
    statement: "Holding perceived threat constant, physiological arousal and avoidance correlate no more strongly than 0.10 in absolute value."
    type: "interval"
    bounds: {lower: -0.10, upper: 0.10}
    diagnostic_vs: []
    claim: {kind: association, x: c_arousal, y: c_avoidance, given: [c_perceived_threat], sign: zero}

auxiliary_assumptions:
  - id: aux1
    statement: "Self-report indexes the latent appraisal construct."
    added_for: null
    protects: [pred1]

# Ströhle et al. (1998) report that an infusion of sodium lactate, an
# interoceptive challenge, raised heart rate in patients with panic disorder.
# The study supports the direction of pred1, not the size it predicts.
evidence:
  - supports: pred1
    source_doi: "10.1176/ajp.155.5.610"
    direction: "corroborates"

# The test outcomes are made up for the example, as their observed text says,
# and osf.io/abcde is a placeholder, not a registration of these tests.
test_outcomes:
  - prediction_id: pred1
    observed: "Illustrative values, not a reported result: arousal reached the predicted band in 78% of trials."
    passed: true
    severity_at_test: 0.7
    registered: "osf.io/abcde"
    date: "2026-05-01"
  - prediction_id: pred_indep
    observed: "Illustrative values, not a reported result: the partial correlation of arousal and avoidance given perceived threat was 0.24."
    passed: false
    registered: null
    date: "2026-05-20"

alternatives:
  - id: alt_cognitive
    label: "Cognitive model of panic"
    key_constructs: ["catastrophic misinterpretation"]
    source_doi: "10.1016/0005-7967(86)90011-2"
  - id: alt_biological
    label: "Biological model of panic"
    key_constructs: ["noradrenergic arousal dysregulation"]
    source_doi: "10.1176/ajp.146.2.148"

formal_model:
  type: "ode"
  spec_ref: "models/panic_ode.py"

provenance:
  - step: "1"
    action: "tf_add_construct"
    detail: "Registered three constructs."
  - step: "2"
    action: "tf_add_proposition"
    detail: "Linked constructs into a feedback network."
  - step: "3"
    action: "tf_add_prediction"
    detail: "Derived three predictions from the propositions."
  - step: "4"
    action: "tf_add_prediction"
    detail: "Stated the independence of arousal and avoidance given perceived threat that the causal graph implies."
