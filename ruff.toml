# Ruff settings for the parts of this monorepo outside python/, which in
# practice means the Python scripts in scripts/: the golden generator, the
# R-vs-Python parity checker, the fold-table generator and the Python app's
# smoke test.
#
# Ruff resolves configuration by walking up from each file, so python/ finds
# python/pyproject.toml and everything else finds this file. Without it,
# those files would take whatever defaults the installed ruff has, which change
# between releases. Extending the real settings rather than restating them keeps
# one source of truth, so the rule set cannot drift between the package and the
# scripts that check it.
extend = "python/pyproject.toml"
