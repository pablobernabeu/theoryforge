# Edge case: a second prior version, which amend-sign-flip and
# amend-weakened-sign amend. Its chain c1 -> c2 -> c3 is signed throughout, and
# h1 states the positive effect of c1 on c2 that p1 entails and that a test
# corroborated. h2 is untested and states no claim.
schema_version: "1.1"
id: edge-amend-prior-corroborated
title: A prior version with a corroborated signed claim
maturity: testing
constructs:
  - {id: c1, label: First, definition: The first construct.}
  - {id: c2, label: Second, definition: The second construct.}
  - {id: c3, label: Third, definition: The third construct.}
propositions:
  - {id: p1, from: c1, to: c2, relation: increases, mechanism: It does.}
  - {id: p2, from: c2, to: c3, relation: increases, mechanism: It does.}
predictions:
  - id: h1
    statement: c2 rises with c1.
    type: directional
    derives_from: [p1]
    bounds: {lower: 0}
    claim: {kind: effect, x: c1, y: c2, sign: positive}
  - id: h2
    statement: c3 rises with c2.
    type: directional
    derives_from: [p2]
test_outcomes:
  - prediction_id: h1
    passed: true
