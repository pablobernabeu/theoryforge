# Edge case: amends amend-prior by moving the core assumption a1, unchanged, to
# the id a_scale. It also adds c4, a proposition p3 from c3 to c4 and a
# corroborated prediction h3 derived from p3. An assumption under a new id
# whose statement matches that of a prior assumption the amendment dropped is
# that assumption renamed, so it is not appraised, and the amendment is
# progressive.
schema_version: "1.1"
id: edge-amend-renamed-assumption
title: An assumption moved to a new id
maturity: testing
constructs:
  - {id: c1, label: First, definition: The first construct.}
  - {id: c2, label: Second, definition: The second construct.}
  - {id: c3, label: Third, definition: The third construct.}
  - {id: c4, label: Fourth, definition: The fourth construct.}
propositions:
  - {id: p1, from: c1, to: c2, relation: increases, mechanism: It does.}
  - {id: p2, from: c2, to: c3, relation: increases, mechanism: It does.}
  - {id: p3, from: c3, to: c4, relation: increases, mechanism: It does.}
predictions:
  - id: h1
    statement: c2 rises 0.5 SD per SD of c1, within 0.1.
    type: point
    derives_from: [p1]
    bounds: {lower: 0.4, upper: 0.6}
    claim: {kind: effect, x: c1, y: c2, sign: positive}
  - id: h2
    statement: c3 rises with c2.
    type: directional
    derives_from: [p2]
  - id: h3
    statement: c4 rises 0.3 SD per SD of c3, within 0.1.
    type: point
    derives_from: [p3]
auxiliary_assumptions:
  - id: a_scale
    statement: The c2 scale measures c2 in every sample.
    added_for: ~
    protects: [h1]
test_outcomes:
  - prediction_id: h1
    passed: false
  - prediction_id: h3
    passed: true
