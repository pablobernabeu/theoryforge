# Edge case: aliases that stand for ten billion values in a file of under
# 1100 bytes. Each sequence repeats the one before it ten times, so the content
# hash, and any other walk of the document, would visit every repeat. Both
# twins refuse the file once the count passes 1000000 values (API_SPEC.md
# section 3), before anything walks it.
schema_version: "1.0"
id: edge-alias-expansion
title: A document that its aliases expand past the limit
maturity: draft
x0: &a0 [ha, ha, ha, ha, ha, ha, ha, ha, ha, ha]
x1: &a1 [*a0, *a0, *a0, *a0, *a0, *a0, *a0, *a0, *a0, *a0]
x2: &a2 [*a1, *a1, *a1, *a1, *a1, *a1, *a1, *a1, *a1, *a1]
x3: &a3 [*a2, *a2, *a2, *a2, *a2, *a2, *a2, *a2, *a2, *a2]
