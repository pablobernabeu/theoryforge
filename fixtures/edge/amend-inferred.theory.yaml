# Edge case: amends amend-prior with an assumption that protects h2, untested
# in the prior, and the refuted h1, and leaves added_for empty. The appraisal
# takes h1, the first prediction in protects that the prior refuted, as the
# anomaly it was added for (added_for_inferred is true). With nothing new to
# protect, the assumption is ad hoc (ad_hoc1) and the amendment degenerating.
schema_version: "1.1"
id: edge-amend-inferred
title: A rescue that does not name its anomaly
maturity: testing
constructs:
  - {id: c1, label: First, definition: The first construct.}
  - {id: c2, label: Second, definition: The second construct.}
  - {id: c3, label: Third, definition: The third construct.}
propositions:
  - {id: p1, from: c1, to: c2, relation: increases, mechanism: It does.}
  - {id: p2, from: c2, to: c3, relation: increases, mechanism: It does.}
predictions:
  - id: h1
    statement: c2 rises 0.5 SD per SD of c1, within 0.1.
    type: point
    derives_from: [p1]
    bounds: {lower: 0.4, upper: 0.6}
    claim: {kind: effect, x: c1, y: c2, sign: positive}
  - id: h2
    statement: c3 rises with c2.
    type: directional
    derives_from: [p2]
auxiliary_assumptions:
  - id: x1
    statement: The effect holds only in a calm setting.
    added_for: ~
    protects: [h2, h1]
test_outcomes:
  - prediction_id: h1
    passed: false
