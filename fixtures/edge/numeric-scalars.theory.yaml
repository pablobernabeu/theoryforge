title: Numbers where strings belong
maturity: building
constructs:
  - id: c1
    label: Yes
    definition: The first construct.
  - id: c2
    label: Beta
    definition: The second construct entirely different.
propositions:
  - id: p1
    from: c1
    to: c2
    relation: increases
    mechanism: Alpha drives Beta.
predictions:
  - id: 7
    statement: Beta rises with Alpha.
    type: directional
    derives_from: [p1]
