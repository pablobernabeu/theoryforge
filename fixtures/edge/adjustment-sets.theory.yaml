# Adjustment sets never hold a construct marked latent, so the effect of x1 on
# y1, confounded by the latent u1 alone, has none, and that of x2 on y2 is
# identified by w2, as dagitty finds. The effect of x3 on y3 has thirteen
# candidates, more than the subset search takes, and the one pass that prunes
# them leaves the empty set.
schema_version: "1.1"
id: "adjustment-sets"
title: "Adjustment sets with latent and many candidate constructs"
maturity: "developing"
constructs:
  - {id: u1, label: "U1", definition: "An unobserved construct.", x_latent: true}
  - {id: x1, label: "X1", definition: "A construct."}
  - {id: y1, label: "Y1", definition: "A construct."}
  - {id: u2, label: "U2", definition: "An unobserved construct.", x_latent: true}
  - {id: w2, label: "W2", definition: "A construct."}
  - {id: x2, label: "X2", definition: "A construct."}
  - {id: y2, label: "Y2", definition: "A construct."}
