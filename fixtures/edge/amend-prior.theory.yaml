# Edge case: the prior version that the other amend-* cases amend. Its chain
# c1 -> c2 -> c3 implies c1 _||_ c3 | c2, and no prediction states that
# independence. A test refuted the point prediction h1, and h2 is untested.
# The core assumption a1 protects h1 and names no anomaly.
schema_version: "1.1"
id: edge-amend-prior
title: The prior version of the amendment cases
maturity: testing
constructs:
  - {id: c1, label: First, definition: The first construct.}
  - {id: c2, label: Second, definition: The second construct.}
  - {id: c3, label: Third, definition: The third construct.}
propositions:
  - {id: p1, from: c1, to: c2, relation: increases, mechanism: It does.}
  - {id: p2, from: c2, to: c3, relation: increases, mechanism: It does.}
predictions:
  - id: h1
    statement: c2 rises 0.5 SD per SD of c1, within 0.1.
    type: point
    derives_from: [p1]
    bounds: {lower: 0.4, upper: 0.6}
    claim: {kind: effect, x: c1, y: c2, sign: positive}
  - id: h2
    statement: c3 rises with c2.
    type: directional
    derives_from: [p2]
auxiliary_assumptions:
  - id: a1
    statement: The c2 scale measures c2 in every sample.
    added_for: ~
    protects: [h1]
test_outcomes:
  - prediction_id: h1
    passed: false
