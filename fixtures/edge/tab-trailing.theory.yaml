# Edge case: a tab after a value, which YAML reads as separating white space.
# R's yaml package, which bundles libyaml, read the file, while PyYAML's
# pure-Python scanner refused a tab it met between tokens. Python now parses
# YAML with libyaml too.
schema_version: "1.1"	
id: edge-tab-trailing
title: A theory whose lines end in tabs		
maturity: building	
constructs:	
  - id: c1	
    label: Alpha
    definition: The first construct.	
  - id: c2
    label: Beta	
    definition: The second construct.
propositions:
  - id: p1
    from: c1
    to: c2	
    relation: increases
predictions:
  - id: h1
    statement: Beta rises with Alpha.	
    type: directional
    derives_from: [p1]	
