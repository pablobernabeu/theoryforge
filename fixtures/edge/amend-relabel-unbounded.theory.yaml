# Edge case: amends amend-prior-unbounded by relabelling the refuted h1 as
# directional and changing nothing else. A point label without two finite
# bounds reads as directional in the comparison, as the claim-form rubric reads
# it, so h1 is not revised and nothing refuted is weakened. The amendment adds
# and loses nothing and is neutral.
schema_version: "1.1"
id: edge-amend-relabel-unbounded
title: A point label without bounds relabelled directional
maturity: testing
constructs:
  - {id: c1, label: First, definition: The first construct.}
  - {id: c2, label: Second, definition: The second construct.}
  - {id: c3, label: Third, definition: The third construct.}
propositions:
  - {id: p1, from: c1, to: c2, relation: increases, mechanism: It does.}
  - {id: p2, from: c2, to: c3, relation: increases, mechanism: It does.}
predictions:
  - id: h1
    statement: c2 rises with c1.
    type: directional
    derives_from: [p1]
    claim: {kind: effect, x: c1, y: c2, sign: positive}
  - id: h2
    statement: c3 rises with c2.
    type: directional
    derives_from: [p2]
test_outcomes:
  - prediction_id: h1
    passed: false
