# Edge case: amends amend-prior with c4, a proposition p3 from c3 to c4 and an
# interval prediction h3 derived from it, recorded as passed although its own
# estimate, -0.1 with a standard error of 0.1, lies below the region 0.2 to
# 0.4. The post-data severity of the pass is 0.001, which
# corroborated_new_severity reports, and the amendment is still progressive.
schema_version: "1.1"
id: edge-amend-low-severity
title: An amendment corroborated by a pass of low severity
maturity: testing
constructs:
  - {id: c1, label: First, definition: The first construct.}
  - {id: c2, label: Second, definition: The second construct.}
  - {id: c3, label: Third, definition: The third construct.}
  - {id: c4, label: Fourth, definition: The fourth construct.}
propositions:
  - {id: p1, from: c1, to: c2, relation: increases, mechanism: It does.}
  - {id: p2, from: c2, to: c3, relation: increases, mechanism: It does.}
  - {id: p3, from: c3, to: c4, relation: increases, mechanism: It does.}
predictions:
  - id: h1
    statement: c2 rises 0.5 SD per SD of c1, within 0.1.
    type: point
    derives_from: [p1]
    bounds: {lower: 0.4, upper: 0.6}
    claim: {kind: effect, x: c1, y: c2, sign: positive}
  - id: h2
    statement: c3 rises with c2.
    type: directional
    derives_from: [p2]
  - id: h3
    statement: c4 rises 0.2 to 0.4 SD per SD of c3.
    type: interval
    derives_from: [p3]
    bounds: {lower: 0.2, upper: 0.4}
auxiliary_assumptions:
  - id: a1
    statement: The c2 scale measures c2 in every sample.
    added_for: ~
    protects: [h1]
test_outcomes:
  - prediction_id: h1
    passed: false
  - prediction_id: h3
    passed: true
    estimate: -0.1
    se: 0.1
