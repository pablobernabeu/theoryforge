# The sign of a marginal association is read off the simple treks between the
# two constructs (Wright, 1934). A trek whose two paths share an edge, such as
# a2 <- a1 -> a2 -> a3, adds no term of its own, so h1 and h2 are entailed
# whatever the sign of the effect of a1 on a2 and of b1 on b2. In h3, the
# simple treks c2 -> c3 and c2 <- c1 -> c3 leave the sign open.
schema_version: "1.1"
id: "trek-signs"
title: "Signs of marginal associations"
maturity: "developing"
constructs:
  - {id: a1, label: "A1", definition: "A construct."}
  - {id: a2, label: "A2", definition: "A construct."}
  - {id: a3, label: "A3", definition: "A construct."}
  - {id: b1, label: "B1", definition: "A construct."}
  - {id: b2, label: "B2", definition: "A construct."}
  - {id: b3, label: "B3", definition: "A construct."}
  - {id: b4, label: "B4", definition: "A construct."}
  - {id: c1, label: "C1", definition: "A construct."}
  - {id: c2, label: "C2", definition: "A construct."}
  - {id: c3, label: "C3", definition: "A construct."}
propositions:
  - {id: p1, from: a1, to: a2, relation: causes, mechanism: "It does."}
  - {id: p2, from: a2, to: a3, relation: increases, mechanism: "It does."}
  - {id: p3, from: b1, to: b2, relation: increases, mechanism: "It does."}
  - {id: p4, from: b1, to: b3, relation: increases, mechanism: "It does."}
  - {id: p5, from: b3, to: b2, relation: decreases, mechanism: "It does."}
  - {id: p6, from: b2, to: b4, relation: increases, mechanism: "It does."}
  - {id: p7, from: c1, to: c2, relation: causes, mechanism: "It does."}
  - {id: p8, from: c1, to: c3, relation: increases, mechanism: "It does."}
  - {id: p9, from: c2, to: c3, relation: increases, mechanism: "It does."}
predictions:
  - {id: h1, statement: "a2 and a3 rise together.", type: directional, derives_from: [p2], claim: {kind: association, x: a3, y: a2, sign: positive}}
  - {id: h2, statement: "b2 and b4 rise together.", type: directional, derives_from: [p6], claim: {kind: association, x: b2, y: b4, sign: positive}}
  - {id: h3, statement: "c2 and c3 rise together.", type: directional, derives_from: [p9], claim: {kind: association, x: c2, y: c3, sign: positive}}
