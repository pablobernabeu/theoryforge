name: docs

on:
  push:
    branches: [main]
    paths:
      - 'r/theoryforge/**'
      - 'python/**'
      - 'apps/**'
      # apps/build.mjs vendors the shared schema and the example fixtures into
      # the published apps, so a change to either alters the deployed site and
      # must trigger a rebuild.
      - 'schema/**'
      - 'fixtures/**'
      # The mkdocs changelog page is a snippet include of the repository
      # changelog, so a release note added here changes the published site even
      # though nothing under python/ is touched.
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
      - '.github/landing.html'
      - '.github/404.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          working-directory: r/theoryforge
          extra-packages: any::pkgdown, local::.

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site("r/theoryforge", new_process = FALSE, install = FALSE)'

      - name: Remove the redundant, unrendered licence stub page
        # pkgdown always renders the bare LICENSE file (needed for CRAN's
        # "MIT + file LICENSE" field) to its own orphaned page, alongside the full
        # text built from LICENSE.md. Keep only the full-text page live -- the one
        # the footer and the home sidebar link -- and drop the markdown copy pkgdown
        # leaves beside the stub. The rest of the family prunes it here too.
        #
        # The sitemap entry goes with the page. pkgdown writes sitemap.xml before
        # this step runs, so deleting the page alone would leave a <loc> advertising
        # a URL that 404s -- and a sitemap is read by search engines, which is the
        # one audience that would then follow it. pkgdown emits one <url> per line,
        # so a line filter removes exactly that entry.
        run: |
          rm -f r/theoryforge/docs/LICENSE-text.html r/theoryforge/docs/LICENSE-text.md
          if [ -f r/theoryforge/docs/sitemap.xml ]; then
            grep -v '/LICENSE-text\.html<' r/theoryforge/docs/sitemap.xml > r/theoryforge/docs/sitemap.new || true
            if [ -s r/theoryforge/docs/sitemap.new ]; then
              mv r/theoryforge/docs/sitemap.new r/theoryforge/docs/sitemap.xml
            else
              rm -f r/theoryforge/docs/sitemap.new
            fi
          fi

      - name: Stage pkgdown under site/r
        run: |
          mkdir -p site
          cp -r r/theoryforge/docs site/r

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build mkdocs site
        run: |
          python -m pip install --quiet -e ./python "mkdocs-material" "mkdocstrings[python]" "markdown-exec"
          cd python && mkdocs build --strict -d ../site/python

      - name: Write landing page
        # 404.html at the published root is the file GitHub Pages serves for
        # every URL that matches nothing on the site; without it visitors get
        # GitHub's generic 404 with no way back to the documentation.
        run: |
          cp r/theoryforge/man/figures/logo.svg site/logo.svg
          cp .github/landing.html site/index.html
          cp .github/404.html site/404.html

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build and stage the interactive apps under site/apps
        run: |
          node apps/build.mjs
          mkdir -p site/apps
          cp -r apps/r apps/py apps/shared site/apps/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
