# Builds the pkgdown site of the R package, the mkdocs site of the Python package
# and the interactive apps, and publishes them to GitHub Pages. A pull request
# builds them without publishing, so that a change that breaks the build shows
# before the merge. Only a push to main, or 'Run workflow' on main, publishes.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'r/theoryforge/**'
      - 'python/**'
      - 'apps/**'
      # apps/build.mjs vendors the schema (the R package's copy, which
      # scripts/gen_golden.py writes from schema/) and the example fixtures
      # into the published apps, so a change to either alters the deployed site
      # and must trigger a rebuild.
      - 'schema/**'
      - 'fixtures/**'
      # The mkdocs changelog page is a snippet include of the repository
      # changelog, so a release note added here changes the published site even
      # though nothing under python/ is touched.
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
      - '.github/landing.html'
      - '.github/404.html'
      - '.github/check_doi_display.py'
  pull_request:
    paths:
      - 'r/theoryforge/**'
      - 'python/**'
      - 'apps/**'
      - 'schema/**'
      - 'fixtures/**'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
      - '.github/landing.html'
      - '.github/404.html'
      - '.github/check_doi_display.py'
  workflow_dispatch:

# The build reads the repository, and only the deploy job writes, to gh-pages.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          working-directory: r/theoryforge
          extra-packages: any::pkgdown, local::.

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site("r/theoryforge", new_process = FALSE, install = FALSE)'

      - name: Remove the redundant, unrendered licence stub page
        # pkgdown always renders the bare LICENSE file (needed for CRAN's
        # "MIT + file LICENSE" field) to its own orphaned page, alongside the
        # full text built from LICENSE.md. Only the full-text page, the one the
        # footer and the home sidebar link, stays live, and the markdown copy
        # that pkgdown leaves beside the stub goes too. The rest of the family
        # prunes it here as well.
        #
        # The sitemap entry goes with the page. pkgdown writes sitemap.xml
        # before this step runs, so deleting the page alone would leave a <loc>
        # for a URL that answers 404, and search engines read the sitemap and
        # would follow it. pkgdown writes one <url> per line, so a line filter
        # removes exactly that entry.
        run: |
          rm -f r/theoryforge/docs/LICENSE-text.html r/theoryforge/docs/LICENSE-text.md
          if [ -f r/theoryforge/docs/sitemap.xml ]; then
            grep -v '/LICENSE-text\.html<' r/theoryforge/docs/sitemap.xml > r/theoryforge/docs/sitemap.new || true
            if [ -s r/theoryforge/docs/sitemap.new ]; then
              mv r/theoryforge/docs/sitemap.new r/theoryforge/docs/sitemap.xml
            else
              rm -f r/theoryforge/docs/sitemap.new
            fi
          fi

      - name: Stage pkgdown under site/r
        run: |
          mkdir -p site
          cp -r r/theoryforge/docs site/r

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Graphviz
        # The guides draw their diagrams when the site is built, through
        # render_diagram() and the render extra's graphviz library, which runs
        # Graphviz's dot. Without it, the figure blocks fail and the strict build
        # stops.
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Build mkdocs site
        run: |
          python -m pip install --quiet -e "./python[docs,render]"
          cd python && mkdocs build --strict -d ../site/python

      - name: Write landing page
        # 404.html at the published root is the file GitHub Pages serves for
        # every URL that matches nothing on the site. Without it, visitors get
        # GitHub's generic 404 with no way back to the documentation.
        run: |
          cp r/theoryforge/man/figures/logo.svg site/logo.svg
          cp .github/landing.html site/index.html
          cp .github/404.html site/404.html

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Build and stage the interactive apps under site/apps
        run: |
          node apps/build.mjs
          mkdir -p site/apps
          cp -r apps/r apps/py apps/shared site/apps/

      - name: Run the staged apps' glue on every example and operation
        # The deploy job waits for this job and not for ci.yml, so the check
        # that the apps run has to stop the deployment here. The scripts read
        # the staged copy, the files GitHub Pages will serve, and keep the glue
        # out of reach of the theoryforge installed above.
        run: |
          python scripts/app_smoke.py site/apps
          Rscript scripts/app_smoke.R site/apps

      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: site
          path: site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Writes the site to the gh-pages branch, the only write in the workflow.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: site
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true

  sidebar-doi:
    name: The R site's sidebar shows the DOI once, as a link
    # pkgdown copies the README's DOI badge into Dev status, where
    # pkgdown/extra.scss hides it, and the Citation component gives the DOI as
    # a link. This fails if pkgdown's markup or the compiled stylesheet stops
    # matching those rules, which would bring the duplicate back. It runs
    # beside the deploy job, so that a failure marks the run red without
    # holding the site back.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: site
          path: site

      - name: Check the DOI in the sidebar
        run: python3 .github/check_doi_display.py --site site/r --package r/theoryforge
