name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  # Dependencies move when this repository does not. A weekly run turns an
  # upstream break into a dated red badge rather than a surprise on the next push.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Every job only checks out and tests the code, so read access to the contents
# is all the workflow needs; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.10 and the classifiers advertise 3.10 to 3.14,
        # so the full advertised range is tested rather than 3.11 alone. The
        # parity and apps jobs stay on a single pinned version because they test
        # cross-language agreement and the app bundle, not Python compatibility.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "python[dev]" build twine pytest-cov
      # python and scripts, not python/src alone: naming the source directory
      # left both the test suite and the two harnesses in scripts/ -- the golden
      # generator and the parity checker -- linted by nothing. python/dist and
      # python/site are build output and gitignored, so ruff skips them without
      # needing an exclude, and apps/py/vendor is ignored for the same reason.
      # scripts/ is covered by the root ruff.toml, which extends the package
      # settings so both trees are held to one rule set.
      - name: Lint (ruff)
        run: ruff check python scripts
      - name: Types (mypy)
        run: mypy python/src/theoryforge --ignore-missing-imports
      - name: Tests
        run: pytest python -q --cov=theoryforge --cov-report=term-missing
      - name: Golden files are up to date
        run: |
          python scripts/gen_golden.py
          # git diff ignores untracked files, so a golden the generator newly
          # creates would slip through; --porcelain reports additions,
          # deletions and modifications. All three trees the generator writes
          # are checked: the root goldens, the copy shipped inside the R package
          # (what the testthat suite reads) and the example theories shipped
          # inside the Python package.
          stale=$(git status --porcelain -- fixtures r/theoryforge/inst/fixtures python/src/theoryforge/fixtures)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::golden files are stale; run scripts/gen_golden.py and commit the result"
            exit 1
          fi
      - name: Build + twine check
        run: |
          python -m build python
          twine check python/dist/*

  # The matrix above installs the package editable from the checkout, where a
  # missing packaged file is masked by the source tree sitting next to it.
  # theoryforge ships schema/ inside the package, so this job proves the built
  # wheel carries it: install into a bare environment, leave the repository, and
  # run the two calls that resolve the packaged resources. Listing the directory
  # would not do; a wheel that shipped theory.schema.json and dropped
  # rigor_checklist.yaml would pass that and then fail on the first check().
  wheel:
    name: Installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build python
      - name: Install the wheel outside the checkout and use its packaged data
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/wheel-venv/bin/pip" install python/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          from importlib.resources import files
          import theoryforge as tf
          print("theoryforge", tf.__version__)
          assert tf.__version__
          t = tf.new_theory("t", "T")
          # validate() resolves theory.schema.json and check() resolves
          # rigor_checklist.yaml, both through importlib.resources from outside
          # the checkout, so a wheel missing either fails here rather than on a
          # user's first call.
          assert t.validate() is True
          report = t.check()
          assert len(report["items"]) == 12, report
          assert report["checklist_version"], report
          assert report["gate"] in ("pass", "blocked", "advisory"), report
          print("packaged schema:", sorted(p.name for p in files("theoryforge").joinpath("schema").iterdir()))
          PY

  # The floor in pyproject is a promise to anyone resolving against an older
  # stack, and nothing tested it. A failure here means the floor needs raising
  # to what actually works, not that the job is too strict.
  minimum-versions:
    name: Declared minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install the declared floors, then the package without resolution
        run: |
          python -m pip install --upgrade pip
          # Every floor pyproject declares, pinned: PyYAML from `dependencies`,
          # pytest from the `dev` extra and graphviz from `render`. Installing
          # the latest pytest here would assert `pytest>=7.0` and never exercise
          # it, and leaving graphviz out leaves render_diagram untested at any
          # version.
          pip install "PyYAML==6.0.*" "pytest==7.0.*" "graphviz==0.20.*"
          pip install -e python --no-deps
      - name: Tests
        run: pytest python -q

  r:
    name: R (CMD check --as-cran, ${{ matrix.config.os }} ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        # The six configurations the rest of the family checks, mirroring what
        # CRAN itself runs: all three operating systems on the released R, plus
        # R-devel on Linux and on Windows and oldrel-1 on Linux. Windows on
        # R-devel is the combination win-builder checks, so running it here
        # gives that signal on every push rather than by email after an upload.
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
    steps:
      - uses: actions/checkout@v7
      # The vignettes are built during the check, so pandoc must be present on
      # every runner rather than assumed from the image.
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          working-directory: r/theoryforge
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r/theoryforge
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  # DESCRIPTION declares `R (>= 4.1.0)` — the version that introduced the native
  # `|>` pipe the examples use — but the matrix above runs release, devel and
  # oldrel-1, all well above it, so the floor itself was an untested claim. This
  # runs the test suite on 4.1 exactly. It is deliberately not a second
  # `--as-cran` check: the claim being tested is "the code runs on the oldest R
  # we promise", not "the package passes CRAN's checks on an unsupported R".
  r-minimum:
    name: R (declared minimum, 4.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
          working-directory: r/theoryforge
      - name: Tests
        shell: Rscript {0}
        run: |
          pkgload::load_all("r/theoryforge", quiet = TRUE)
          res <- testthat::test_dir("r/theoryforge/tests/testthat", stop_on_failure = TRUE)
          invisible(res)

  # Reports R test coverage on each run, writing the percentage to the run
  # summary. It uses no external service (no Codecov), so it needs no token and
  # adds no badge that could rot. One Linux runner is enough: coverage does not
  # vary by platform, only the tests it counts do, and those run above.
  r-coverage:
    name: R coverage (covr)
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: check
          working-directory: r/theoryforge
      - name: Measure and report coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage("r/theoryforge", quiet = FALSE)
          pct <- round(covr::percent_coverage(cov), 1)
          cat(sprintf("Test coverage: %s%%\n", pct))
          summary <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary)) {
            cat(sprintf("## Test coverage: **%s%%**\n", pct),
                file = summary, append = TRUE)
          }
          if (pct < 80) {
            cat("::warning::Test coverage is below 80%\n")
          }

  apps:
    name: Apps (syntax + vendor build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Syntax-check the app sources
        run: |
          node --check apps/shared/app-core.js
          node --check apps/r/r-runtime.js
          node --check apps/py/py-runtime.js
          node --check apps/build.mjs
      - name: The vendor build assembles cleanly
        run: |
          node apps/build.mjs
          node -e "const m=require('./apps/r/vendor/manifest.json'); if(!m.rFiles.length||!m.examples.length) throw new Error('empty R manifest')"
          node -e "const m=require('./apps/py/vendor/manifest.json'); if(!m.pyFiles.length||!m.examples.length) throw new Error('empty Python manifest')"

  parity:
    name: Cross-language parity
    runs-on: ubuntu-latest
    needs: [python, r]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::yaml
            any::jsonlite
            any::pkgload
          working-directory: r/theoryforge
      # The R package is loaded from r/theoryforge by the emitter rather than
      # taken off the library path, so this job no longer depends on having
      # installed it first: it reports on the tree being reviewed either way.
      # The distribution itself is covered by the six R CMD check cells above.
      - name: Install the Python package
        run: pip install -e python
      - name: Check R == Python on every fixture
        run: python scripts/parity_check.py
